[package]
name = "ai-project-viewer"
version = "0.6.2"
description = "AI Project Viewer - a lightweight project observer for AI agent programming workflows"
authors = ["AI Project Viewer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name unique vs the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "ai_project_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
encoding_rs = "0.8"
base64 = "0.22"
md5 = "0.7"
tauri-plugin-opener = "2.7.0"

[dev-dependencies]
tempfile = "3"

# WebView2 fine-tuning on Windows (browser accelerator keys, V1.5 §147);
# versions must match what wry pins (see Cargo.lock).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
